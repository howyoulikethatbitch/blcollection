<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Azure BL Collection — a dreamy library of BL visual novels." />
    <meta name="theme-color" content="#101d62" />
    <link rel="icon" type="image/jpeg" href="./assets/azure-logo.jpg" />
    <link rel="apple-touch-icon" href="./assets/azure-logo.jpg" />
    <title>Azure BL Collection</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('azure-theme');
          const prefersNight = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = saved === 'night' || (saved !== 'light' && prefersNight) ? 'night' : 'light';
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
